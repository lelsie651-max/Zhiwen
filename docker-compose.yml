services:
  postgres:
    image: postgres:16-alpine
    container_name: zhiwen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zhiwen
      POSTGRES_USER: zhiwen
      POSTGRES_PASSWORD: zhiwen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
